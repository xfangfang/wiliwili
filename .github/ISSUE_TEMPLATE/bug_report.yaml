name: Bug report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: dropdown
    validations:
      required: true
    attributes:
      label: 您要为哪些平台反馈BUG?
      description: 点击下拉选择对应的平台，若均不符合请选择其他，并于下一节补充
      options:
        - 此 BUG 与具体平台无关
        - PlayStation 5
        - Nintendo Switch
        - PSVita
        - PS4
        - Xbox 系列
        - Linux 桌面/掌机
        - Windows 桌面/掌机
        - macOS
        - PC 全平台 (包含 Windows, macOS, Linux)
        - 其他
      default: 0
  - type: input
    attributes:
      label: 设备的系统版本与破解环境
      description: "如: PS5 FW 11.60 + ShadowMountPlus 1.7beta6 + kstuff / Switch 13.0.0 / Win11..."
  - type: input
    attributes:
      label: CPU / 主机型号
      description: "部分问题可能与型号有关，游戏主机请填写主机型号"
  - type: input
    attributes:
      label: GPU 型号
      description: "部分问题可能与GPU型号有关，游戏主机请填写主机型号"
  - type: textarea
    validations:
      required: true
    attributes:
      label: 描述你遇到的问题
      description: 简洁地描述问题并提供复现步骤。PS5 用户若遇闪退/报错，请附上电视屏幕弹出的 Toast 报错截图或拍照（包含 stage 阶段和 caller 等信息）。
  - type: textarea
    attributes:
      label: 应用日志
      description: "PS5 请附上 ShadowMount 的 debug.log；PC 可使用命令行运行 `wiliwili -d -t -o log.txt`"
      placeholder: 请在此粘贴日志内容或拖入日志文件
  - type: checkboxes
    attributes:
      label: 问题确认
      description: 选中下方复选框，代表您已阅读过下列内容
      options:
        - label: 阅读了 [反馈问题前要做的事](https://github.com/xfangfang/wiliwili?tab=readme-ov-file#反馈问题前要做的事)
          required: true
        - label: 搜索了 [历史 issue](https://github.com/xfangfang/wiliwili/issues?q=is%3Aissue) ，并未发现相同问题
          required: true
        - label: 查看了 [应用 wiki](https://github.com/xfangfang/wiliwili/wiki)
          required: true